name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir app
          unzip -q auron-project.zip -d app

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build web app
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Create Android project
        working-directory: app
        run: |
          npx cap add android
          # microphone permission (needed for voice assistant)
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' android/app/src/main/AndroidManifest.xml
          grep -n "uses-permission" android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleDebug

      - name: Publish APK (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Auron APK #${{ github.run_number }}
          files: app/android/app/build/outputs/apk/debug/app-debug.apk
